
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端引导流程与应用内容原型</title>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11.11.13/dist/framer-motion.js"></script>
    <script>
        window.Motion = framer.motion;
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #fcfcfc;
            --surface: #ffffff;
            --fg: #1a1a1a;
            --muted: #757575;
            --border: #e5e5e5;
            --accent: #007AFF;
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .phone-frame {
            width: 390px;
            height: 844px;
            border: 8px solid #222;
            border-radius: 44px;
            background: var(--surface);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .status-bar {
            height: 44px;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }
        .pill-button {
            background-color: var(--accent);
            color: white;
            border-radius: 9999px;
            padding: 16px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .pill-button:active {
            opacity: 0.8;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #9ca3af; /* 明确设置非选中状态的浅灰色文字 */
        }
        .sidebar-item:hover {
            background-color: #1f2937; /* 适配深色背景的悬停色 */
            color: #ffffff; /* 悬停时文字变白 */
        }
        .sidebar-item.active {
            background-color: #eef4ff;
            color: #007AFF; /* 激活状态保持蓝色 */
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion } = window.Motion;

        const StatusBar = () => (
            <div className="status-bar">
                <span>9:41</span>
                <div className="flex gap-1">
                    <div className="w-4 h-2 bg-black rounded-sm"></div>
                    <div className="w-4 h-2 bg-black rounded-sm"></div>
                </div>
            </div>
        );

        // --- 引导流程组件 ---
        const Screen1 = () => (
            <div className="h-full flex flex-col items-center justify-center p-8 text-center">
                <motion.div 
                    initial={{ scale: 0.8, opacity: 0 }}
                    animate={{ scale: 1, opacity: 1 }}
                    transition={{ duration: 0.6 }}
                    className="w-32 h-32 bg-blue-600 rounded-3xl mb-12 flex items-center justify-center shadow-xl"
                >
                    <span className="text-white text-4xl font-bold">M</span>
                </motion.div>
                <h1 className="text-3xl font-bold mb-4">欢迎来到新境界</h1>
                <p className="text-gray-500 mb-12">开启您的极简生产力之旅，让每一个创意都能被看见。</p>
                <div className="w-12 h-1 bg-gray-200 rounded-full"></div>
            </div>
        );

        const Screen2 = () => (
            <div className="h-full flex flex-col p-8 justify-center">
                <h2 className="text-2xl font-bold mb-6">核心价值主张</h2>
                <div className="space-y-8">
                    <div className="flex gap-4">
                        <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center shrink-0">✨</div>
                        <div>
                            <h3 className="font-bold mb-2">极致的流畅体验</h3>
                            <p className="text-sm text-gray-500">毫秒级响应，为您的创作提供最稳定的交互保障。</p>
                        </div>
                    </div>
                    <div className="flex gap-4">
                        <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center shrink-0">🛡️</div>
                        <div>
                            <h3 className="font-bold mb-2">企业级安全性</h3>
                            <p className="text-sm text-gray-500">端到端加密，确保您的每一项数据都处于安全防护下。</p>
                        </div>
                    </div>
                    <div className="flex gap-4">
                        <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center shrink-0">🎨</div>
                        <div>
                            <h3 className="font-bold mb-2">高度可定制</h3>
                            <p className="text-sm text-gray-500">个性化配置，适配各种复杂的业务工作流。</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const Screen3 = () => (
            <div className="h-full flex flex-col p-8 justify-center">
                <h2 className="text-2xl font-bold mb-2">加入我们</h2>
                <p className="text-gray-500 mb-8">使用您的账号开始体验。</p>
                <div className="space-y-4 mb-8">
                    <div className="w-full h-12 border border-gray-200 rounded-xl px-4 flex items-center text-gray-400 text-sm">
                        请输入邮箱或手机号
                    </div>
                    <div className="w-full h-12 border border-gray-200 rounded-xl px-4 flex items-center text-gray-400 text-sm">
                        ••••••••••••
                    </div>
                    <button className="w-full h-12 border border-gray-200 rounded-xl px-4 flex items-center justify-between text-sm text-gray-500">
                        <span>使用 Apple 登录</span>
                        <span className="bg-black text-white px-2 py-1 rounded-md">Continue</span>
                    </button>
                    <button className="w-full h-12 border border-gray-200 rounded-xl px-4 flex items-center justify-between text-sm text-gray-500">
                        <span>使用 Google 登录</span>
                        <span className="bg-black text-white px-2 py-1 rounded-md">Continue</span>
                    </button>
                </div>
                <button className="pill-button w-full">开始使用</button>
                <button className="mt-4 text-sm text-gray-400 w-full text-center">跳过</button>
            </div>
        );

        // --- 新增的应用内容组件 ---
        const DashboardPage = () => (
            <div className="p-6 pt-12">
                <h2 className="text-2xl font-bold mb-6">数据概览</h2>
                <div className="grid grid-cols-2 gap-4 mb-8">
                    <div className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                        <div className="text-gray-400 text-xs mb-1">今日活跃</div>
                        <div className="text-xl font-bold">12,402</div>
                    </div>
                    <div className="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                        <div className="text-gray-400 text-xs mb-1">新用户</div>
                        <div className="text-xl font-bold">+342</div>
                    </div>
                </div>
                <div className="space-y-4">
                    <div className="h-32 bg-gray-50 rounded-2xl border border-gray-100 flex items-end p-4 gap-2">
                        {[40, 70, 45, 90, 65, 80, 95].map((h, i) => (
                            <div key={i} className="flex-1 bg-blue-100 rounded-t-md" style={{ height: `${h}%` }}></div>
                        ))}
                    </div>
                    <div className="h-32 bg-gray-50 rounded-2xl border border-gray-100 flex items-center justify-center text-gray-300 italic">
                        图表占位符
                    </div>
                </div>
            </div>
        );

        const SettingsPage = () => (
            <div className="p-6 pt-12">
                <h2 className="text-2xl font-bold mb-6">个人设置</h2>
                <div className="space-y-6">
                    <div className="flex items-center gap-4">
                        <div className="w-12 h-12 bg-gray-200 rounded-full"></div>
                        <div>
                            <div className="font-bold">用户名称</div>
                            <div className="text-xs text-gray-400">用户ID: 88291</div>
                        </div>
                    </div>
                    <div className="space-y-4 pt-4 border-t border-gray-100">
                        <div className="flex justify-between items-center">
                            <span className="text-gray-600">通知推送</span>
                            <div className="w-10 h-5 bg-blue-600 rounded-full relative">
                                <div className="absolute right-1 top-1 w-3 h-3 bg-white rounded-full"></div>
                            </div>
                        </div>
                        <div className="flex justify-between items-center">
                            <span className="text-gray-600">深色模式</span>
                            <div className="w-10 h-5 bg-gray-300 rounded-full relative">
                                <div className="absolute left-1 top-1 w-3 h-3 bg-white rounded-full"></div>
                            </div>
                        </div>
                        <div className="flex justify-between items-center">
                            <span className="text-gray-600">两步验证</span>
                            <span className="text-blue-600 text-sm">开启</span>
                        </div>
                    </div>
                    <div className="pt-8">
                        <button className="w-full py-3 text-red-500 border border-red-100 rounded-xl">退出登录</button>
                    </div>
                </div>
            </div>
        );

        const AppContentPage = () => {
            const [isCollapsed, setIsCollapsed] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');

            const renderContent = () => {
                if (activeTab === 'dashboard') return <DashboardPage />;
                if (activeTab === 'settings') return <SettingsPage />;
                return null;
            };

            return (
                <div className="flex h-full bg-gray-50">
                    {/* 侧边导航栏 */}
                    <div
                        className={`fixed top-0 left-0 h-full bg-gray-900 border-r border-gray-800 flex flex-col transition-all duration-300 z-40 ${isCollapsed ? 'w-0 opacity-0' : 'w-40 opacity-100'}`}
                        onClick={() => setIsCollapsed(false)}
                    >
                        <div className="p-4 mb-4 flex items-center justify-between">
                            <div
                                className={`bg-blue-600 w-8 h-8 rounded-lg flex items-center justify-center text-white font-bold ${isCollapsed ? 'mx-auto' : 'ml-2'}`}
                                onClick={(e) => {
                                    e.stopPropagation();
                                    setIsCollapsed(!isCollapsed);
                                }}
                            >M</div>
                            {!isCollapsed && (
                                <button
                                    onClick={() => setIsCollapsed(true)}
                                    className="p-1 hover:bg-gray-800 rounded"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            )}
                            {isCollapsed && (
                                <button
                                    onClick={() => setIsCollapsed(false)}
                                    className="p-1 hover:bg-gray-800 rounded"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                                </button>
                            )}
                        </div>
                        <nav className="flex-1 px-2 space-y-3">
                            <div
                                onClick={() => {
                                    setActiveTab('dashboard');
                                    if (isCollapsed) setIsCollapsed(false);
                                }}
                                className={`sidebar-item ${activeTab === 'dashboard' ? 'active' : ''}`}
                            >
                                <span className="text-[10px]">{isCollapsed ? '📊' : '📊 仪表盘'}</span>
                            </div>
                            <div
                                onClick={() => {
                                    setActiveTab('settings');
                                    if (isCollapsed) setIsCollapsed(false);
                                }}
                                className={`sidebar-item ${activeTab === 'settings' ? 'active' : ''}`}
                            >
                                <span className="text-[10px]">{isCollapsed ? '⚙️' : '⚙️ 个人设置'}</span>
                            </div>
                        </nav>
                        <div className="p-4 border-t border-gray-800">
                            <div className={`sidebar-item text-red-400 ${activeTab === 'logout' ? 'active' : ''}`} onClick={() => setActiveTab('logout')}>
                                <span className="text-[10px]">{isCollapsed ? '🚪' : '🚪 退出登录'}</span>
                            </div>
                        </div>
                    </div>
                    {/* 内容区域 */}
                    <div className={`flex-1 overflow-y-auto bg-gray-50 transition-all duration-300 ${isCollapsed ? 'ml-0' : 'ml-40'}`}>
                        {renderContent()}
                    </div>
                </div>
            );
        };


        const OnboardingApp = () => {
            const [currentScreen, setCurrentScreen] = useState(0);
            const [showAppContent, setShowAppContent] = useState(false);

            const screens = [
                <Screen1 />,
                <Screen2 />,
                <Screen3 />,
                <AppContentPage />
            ];

            // 模拟登录后的状态切换
            const handleContinue = () => {
                if (currentScreen === 2) setShowAppContent(true);
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-10 bg-gray-50">
                    <h1 className="mb-10 text-2xl font-bold">移动端引导流程与应用内容原型</h1>
                    
                    <div className="flex gap-8">
                        {screens.map((screen, idx) => (
                            <div key={idx} className="flex flex-col items-center">
                                <div className="phone-frame">
                                    <StatusBar />
                                    {showAppContent && idx === 3 ? (
                                        <AppContentPage />
                                    ) : (
                                        screen
                                    )}
                                </div>
                                <span className="mt-4 text-sm text-gray-400 font-mono">屏幕 {idx + 1}</span>
                            </div>
                        ))}
                    </div>

                    <div className="mt-12 flex gap-3">
                        {[0, 1, 2, 3].map(i => (
                            <div key={i} className={`w-2 h-2 rounded-full ${currentScreen === i ? 'bg-blue-600 w-6' : 'bg-gray-300'}`} />
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OnboardingApp />);
    </script>
</body>
</html>
