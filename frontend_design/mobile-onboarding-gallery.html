
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端引导流程原型</title>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11.11.13/dist/framer-motion.js"></script>
    <script>
        window.Motion = framer.motion;
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #fcfcfc;
            --surface: #ffffff;
            --fg: #1a1a1a;
            --muted: #757575;
            --border: #e5e5e5;
            --accent: #007AFF; /* 现代简约常用的品牌色 */
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .phone-frame {
            width: 390px;
            height: 844px;
            border: 8px solid #222;
            border-radius: 44px;
            background: var(--surface);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
        }
        .status-bar {
            height: 44px;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .pill-button {
            background-color: var(--accent);
            color: white;
            border-radius: 9999px;
            padding: 16px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .pill-button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { motion } = window.Motion;

        const StatusBar = () => (
            <div className="status-bar">
                <span>9:41</span>
                <div className="flex gap-1">
                    <div className="w-4 h-2 bg-black rounded-sm"></div>
                    <div className="w-4 h-2 bg-black rounded-sm"></div>
                </div>
            </div>
        );

        const Screen1 = () => (
            <div className="h-full flex flex-col items-center justify-center p-8 text-center">
                <motion.div 
                    initial={{ scale: 0.8, opacity: 0 }}
                    animate={{ scale: 1, opacity: 1 }}
                    transition={{ duration: 0.6 }}
                    className="w-32 h-32 bg-blue-600 rounded-3xl mb-12 flex items-center justify-center shadow-xl"
                >
                    <span className="text-white text-4xl font-bold">M</span>
                </motion.div>
                <h1 className="text-3xl font-bold mb-4">欢迎来到新境界</h1>
                <p className="text-gray-500 mb-12">开启您的极简生产力之旅，让每一个创意都能被看见。</p>
                <div className="w-12 h-1 bg-gray-200 rounded-full"></div>
            </div>
        );

        const Screen2 = () => (
            <div className="h-full flex flex-col p-8 justify-center">
                <h2 className="text-2xl font-bold mb-6">核心价值主张</h2>
                <div className="space-y-8">
                    <div className="flex gap-4">
                        <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center shrink-0">✨</div>
                        <div>
                            <h3 className="font-bold mb-2">极致的流畅体验</h3>
                            <p className="text-sm text-gray-500">毫秒级响应，为您的创作提供最稳定的交互保障。</p>
                        </div>
                    </div>
                    <div className="flex gap-4">
                        <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center shrink-0">🛡️</div>
                        <div>
                            <h3 className="font-bold mb-2">企业级安全性</h3>
                            <p className="text-sm text-gray-500">端到端加密，确保您的每一项数据都处于安全防护下。</p>
                        </div>
                    </div>
                    <div className="flex gap-4">
                        <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center shrink-0">🎨</div>
                        <div>
                            <h3 className="font-bold mb-2">高度可定制</h3>
                            <p className="text-sm text-gray-500">个性化配置，适配各种复杂的业务工作流。</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const Screen3 = () => (
            <div className="h-full flex flex-col p-8 justify-center">
                <h2 className="text-2xl font-bold mb-2">加入我们</h2>
                <p className="text-gray-500 mb-8">使用您的账号开始体验。</p>
                <div className="space-y-4 mb-8">
                    <div className="w-full h-12 border border-gray-200 rounded-xl px-4 flex items-center text-gray-400 text-sm">
                        请输入邮箱或手机号
                    </div>
                    <div className="w-full h-12 border border-gray-200 rounded-xl px-4 flex items-center text-gray-400 text-sm">
                        ••••••••••••
                    </div>
                    <button className="w-full h-12 border border-gray-200 rounded-xl px-4 flex items-center justify-between text-sm text-gray-500">
                        <span>使用 Apple 登录</span>
                        <span className="bg-black text-white px-2 py-1 rounded-md">Continue</span>
                    </button>
                    <button className="w-full h-12 border border-gray-200 rounded-xl px-4 flex items-center justify-between text-sm text-gray-500">
                        <span>使用 Google 登录</span>
                        <span className="bg-black text-white px-2 py-1 rounded-md">Continue</span>
                    </button>
                </div>
                <button className="pill-button w-full">开始使用</button>
                <button className="mt-4 text-sm text-gray-400 w-full text-center">
                    跳过
                </button>
            </div>
        );

        const OnboardingApp = () => {
            const [currentScreen, setCurrentScreen] = useState(0);
            const screens = [
                <Screen1 />,
                <Screen2 />,
                <Screen3 />
            ];

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-10 bg-gray-50">
                    <h1 className="mb-10 text-2xl font-bold">移动端引导流程原型 (Gallery View)</h1>
                    
                    <div className="flex gap-8">
                        {screens.map((screen, idx) => (
                            <div key={idx} className="flex flex-col items-center">
                                <div className="phone-frame">
                                    <StatusBar />
                                    {screen}
                                </div>
                                <span className="mt-4 text-sm text-gray-400 font-mono">屏幕 {idx + 1}</span>
                            </div>
                        ))}
                    </div>

                    <div className="mt-12 flex gap-3">
                        {[0, 1, 2].map(i => (
                            <div key={i} className={`w-2 h-2 rounded-full ${currentScreen === i ? 'bg-blue-600 w-6' : 'bg-gray-300'}`} />
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OnboardingApp />);
    </script>
</body>
</html>
